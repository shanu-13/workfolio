<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off-track — R.A. Shankari</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 18px;
      background: #111113; color: #f4f1ea; font-family: "Space Grotesk", sans-serif; padding: 16px;
    }
    .code { font-size: clamp(90px, 20vw, 200px); font-weight: 700; letter-spacing: -.06em; line-height: 1; color: transparent; -webkit-text-stroke: 2px #e10600; }
    h1 { font-size: clamp(26px, 4vw, 44px); font-weight: 500; letter-spacing: -.03em; margin: 0; }
    em { font-family: "Instrument Serif", serif; color: #e10600; }
    p { color: #a3a3ad; margin: 0; }
    a { justify-self: center; margin-top: 12px; background: #e10600; color: #fff; padding: 12px 24px; border-radius: 999px; text-decoration: none; }
    .kerb { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(90deg, #e10600 0 40px, #f4f1ea 40px 80px); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>You've gone <em>off-track</em> 🚧</h1>
  <p>This page is stuck in the gravel trap.</p>
  <a href="/">Return to pit lane</a>
  <div class="kerb"></div>
</body>
</html>
